<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام محاسبي - نسخة مبسطة للاختبار</title>
    <style>
        body { font-family: 'Tajawal', sans-serif; background: #0d47a1; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 20px; width: 350px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; }
        button { width: 100%; padding: 12px; background: #0d47a1; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
        .error { color: red; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>النظام المحاسبي</h2>
        <input type="text" id="username" placeholder="اسم المستخدم">
        <input type="password" id="password" placeholder="كلمة المرور">
        <button onclick="login()">تسجيل الدخول</button>
        <div class="error" id="errorMsg">بيانات الدخول غير صحيحة</div>
        <div style="margin-top: 15px; font-size: 12px;">admin / 123456</div>
    </div>

    <script>
        // مستخدمين ثابتين للتجربة
        const users = [
            { username: "admin", password: "123456", name: "مدير النظام" },
            { username: "accountant", password: "123456", name: "محاسب" },
            { username: "viewer", password: "123456", name: "مشاهد" }
        ];

        function login() {
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            
            const user = users.find(u => u.username === username && u.password === password);
            
            if (user) {
                // حفظ جلسة المستخدم
                localStorage.setItem("currentUser", JSON.stringify(user));
                alert("تم تسجيل الدخول بنجاح! مرحباً " + user.name);
                // هنا تقدر تحول لباقي النظام
                document.body.innerHTML = "<div style='background:white; padding:50px; text-align:center;'><h1>✓ تم تسجيل الدخول بنجاح</h1><p>مرحباً " + user.name + "</p><button onclick='logout()'>تسجيل خروج</button></div>";
            } else {
                document.getElementById("errorMsg").style.display = "block";
            }
        }
        
        function logout() {
            localStorage.removeItem("currentUser");
            location.reload();
        }
        
        // التحقق من وجود جلسة سابقة
        const savedUser = localStorage.getItem("currentUser");
        if (savedUser) {
            const user = JSON.parse(savedUser);
            document.body.innerHTML = "<div style='background:white; padding:50px; text-align:center;'><h1>✓ مرحباً بعودتك</h1><p>" + user.name + "</p><button onclick='logout()'>تسجيل خروج</button></div>";
        }
    </script>
</body>
</html>
