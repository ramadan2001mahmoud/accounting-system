<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام محاسبي متكامل - الإصدار المستقر</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background: #f4f7fc; }
        /* شاشة الدخول */
        .login-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #0d47a1, #1976d2); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .login-card { background: white; padding: 40px; border-radius: 20px; width: 350px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .login-card h2 { color: #0d47a1; margin-bottom: 20px; }
        .login-card input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; }
        .login-card button { width: 100%; padding: 12px; background: #0d47a1; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .error-msg { color: red; margin-top: 10px; display: none; }
        /* الواجهة الرئيسية */
        .app-header { background: #0d47a1; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .sidebar { position: fixed; right: 0; top: 60px; width: 220px; height: 100%; background: white; box-shadow: -2px 0 5px rgba(0,0,0,0.1); padding-top: 20px; }
        .sidebar-item { padding: 12px 20px; cursor: pointer; border-right: 3px solid transparent; }
        .sidebar-item:hover, .sidebar-item.active { background: #e3f2fd; border-right-color: #0d47a1; color: #0d47a1; font-weight: bold; }
        .main-content { margin-right: 240px; padding: 20px; }
        .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 15px; margin-bottom: 20px; }
        .stat-box { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 20px; border-radius: 12px; text-align: center; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background: #0d47a1; color: white; }
        button { background: #0d47a1; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; margin: 5px; }
        .btn-success { background: #28a745; }
        .btn-danger { background: #dc3545; }
        .btn-warning { background: #ff9800; }
        input, select { padding: 8px; border-radius: 6px; border: 1px solid #ccc; width: 100%; margin: 5px 0; }
        .form-row { display: flex; gap: 10px; margin-bottom: 10px; }
    </style>
</head>
<body>

<!-- شاشة الدخول -->
<div id="loginScreen" class="login-container">
    <div class="login-card">
        <h2>📊 نظام محاسبي متكامل</h2>
        <input type="text" id="loginUsername" placeholder="اسم المستخدم">
        <input type="password" id="loginPassword" placeholder="كلمة المرور">
        <button onclick="doLogin()">دخول</button>
        <div id="loginError" class="error-msg">❌ بيانات غير صحيحة</div>
        <div style="margin-top:15px; font-size:12px;">admin / 123456</div>
    </div>
</div>

<!-- التطبيق الرئيسي -->
<div id="app" style="display:none;">
    <div class="app-header">
        <span>📊 نظام محاسبي متكامل</span>
        <span id="userName"></span>
        <button onclick="logout()" style="background:#dc3545;">خروج</button>
    </div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-item active" data-page="dashboard">🏠 الرئيسية</div>
        <div class="sidebar-item" data-page="journal">📝 قيد يومية</div>
        <div class="sidebar-item" data-page="entries">📋 قائمة القيود</div>
        <div class="sidebar-item" data-page="income">💰 قائمة الدخل</div>
        <div class="sidebar-item" data-page="balance">⚖️ المركز المالي</div>
        <div class="sidebar-item" data-page="trial">📊 ميزان المراجعة</div>
        <div class="sidebar-item" data-page="users">👥 المستخدمين</div>
        <div class="sidebar-item" data-page="password">🔑 تغيير كلمة المرور</div>
    </div>
    <div class="main-content" id="mainContent"></div>
</div>

<script>
    // ---------- قاعدة بيانات المستخدمين ----------
    let users = [
        { id: 1, username: "admin", password: "123456", name: "المدير", role: "admin" },
        { id: 2, username: "accountant", password: "123456", name: "محاسب", role: "accountant" },
        { id: 3, username: "viewer", password: "123456", name: "مشاهد", role: "viewer" }
    ];
    let currentUser = null;

    // ---------- الحسابات ----------
    let accounts = [
        { id: 1, code: "1000", name: "الصندوق", type: "asset" },
        { id: 2, code: "2000", name: "البنك", type: "asset" },
        { id: 3, code: "3000", name: "المبيعات", type: "income" },
        { id: 4, code: "4000", name: "المشتريات", type: "expense" },
        { id: 5, code: "5000", name: "رواتب", type: "expense" },
        { id: 6, code: "6000", name: "رأس المال", type: "equity" }
    ];

    // ---------- القيود المحاسبية ----------
    let journalEntries = [];
    let editingId = null;

    // ---------- دوال مساعدة ----------
    function saveData() {
        if(currentUser) localStorage.setItem(`data_${currentUser.username}`, JSON.stringify(journalEntries));
    }
    function loadData() {
        if(currentUser) {
            let saved = localStorage.getItem(`data_${currentUser.username}`);
            if(saved) journalEntries = JSON.parse(saved);
            else journalEntries = [];
        }
    }

    function showMessage(msg, type="success") {
        alert(msg); // بسيطة وسهلة
    }

    // حساب الأرصدة
    function getBalances() {
        let balances = {};
        accounts.forEach(acc => balances[acc.id] = { debit: 0, credit: 0 });
        journalEntries.forEach(entry => {
            entry.lines.forEach(line => {
                if(balances[line.accountId]) {
                    balances[line.accountId].debit += line.debit;
                    balances[line.accountId].credit += line.credit;
                }
            });
        });
        let final = {};
        accounts.forEach(acc => {
            let diff = balances[acc.id].debit - balances[acc.id].credit;
            if(acc.type === "asset" || acc.type === "expense") final[acc.id] = { amount: diff, type: "debit", name: acc.name };
            else final[acc.id] = { amount: -diff, type: "credit", name: acc.name };
        });
        return final;
    }

    // ----- عرض الصفحات -----
    function showDashboard() {
        let balances = getBalances();
        let totalAssets = 0, totalIncome = 0, totalExpense = 0;
        accounts.forEach(acc => {
            let amt = balances[acc.id]?.amount || 0;
            if(acc.type === "asset") totalAssets += amt;
            if(acc.type === "income") totalIncome += amt;
            if(acc.type === "expense") totalExpense += amt;
        });
        let net = totalIncome - totalExpense;
        let html = `
            <div class="stats">
                <div class="stat-box">💰 الأصول<br><b>${totalAssets.toFixed(2)}</b></div>
                <div class="stat-box">📈 الإيرادات<br><b>${totalIncome.toFixed(2)}</b></div>
                <div class="stat-box">📉 المصروفات<br><b>${totalExpense.toFixed(2)}</b></div>
                <div class="stat-box">🏆 صافي الربح<br><b>${net.toFixed(2)}</b></div>
            </div>
            <div class="card"><h3>📌 آخر القيود</h3><div class="table-responsive"><table><thead><tr><th>التاريخ</th><th>البيان</th><th>عدد السطور</th></tr></thead><tbody>
            ${journalEntries.slice(-5).reverse().map(e => `<tr><td>${e.date}</td><td>${e.desc}</td><td>${e.lines.length}</td></tr>`).join('')}
            ${journalEntries.length === 0 ? '<tr><td colspan="3">لا توجد قيود</td></tr>' : ''}
            </tbody></div></div>`;
        document.getElementById("mainContent").innerHTML = html;
    }

    function showJournal() {
        if(currentUser.role !== 'admin' && currentUser.role !== 'accountant') {
            document.getElementById("mainContent").innerHTML = "<div class='card'>❌ غير مسموح</div>";
            return;
        }
        let isEdit = editingId !== null;
        let entry = isEdit ? journalEntries.find(e => e.id === editingId) : null;
        let rows = isEdit ? entry.lines : [{ accountId: "", debit: 0, credit: 0 }];
        let accOptions = accounts.map(a => `<option value="${a.id}">${a.code} - ${a.name}</option>`).join("");
        let rowsHtml = rows.map((r,idx) => `
            <div class="form-row" id="row${idx}">
                <select class="accSelect" data-idx="${idx}">${accOptions}</select>
                <input type="number" class="debitVal" data-idx="${idx}" placeholder="مدين" value="${r.debit}">
                <input type="number" class="creditVal" data-idx="${idx}" placeholder="دائن" value="${r.credit}">
                <button onclick="removeRow(${idx})" class="btn-danger">حذف</button>
            </div>
        `).join("");
        let html = `
        <div class="card">
            <h3>${isEdit ? "تعديل قيد" : "إدخال قيد"}</h3>
            <input type="date" id="entryDate" value="${isEdit ? entry.date : new Date().toISOString().split('T')[0]}">
            <input type="text" id="entryDesc" placeholder="البيان" value="${isEdit ? entry.desc : ''}">
            <div id="rowsContainer">${rowsHtml}</div>
            <button onclick="addRow()" class="btn-success">➕ إضافة سطر</button>
            <button onclick="saveEntry()" class="btn-success">💾 حفظ</button>
            ${isEdit ? '<button onclick="cancelEdit()" class="btn-warning">إلغاء</button>' : ''}
        </div>`;
        document.getElementById("mainContent").innerHTML = html;
        // ربط الأحداث
        document.querySelectorAll(".accSelect").forEach(sel => {
            let idx = sel.dataset.idx;
            if(rows[idx]?.accountId) sel.value = rows[idx].accountId;
            sel.onchange = (e) => rows[parseInt(e.target.dataset.idx)].accountId = parseInt(e.target.value);
        });
        document.querySelectorAll(".debitVal").forEach(inp => {
            inp.onchange = (e) => rows[parseInt(e.target.dataset.idx)].debit = parseFloat(e.target.value) || 0;
        });
        document.querySelectorAll(".creditVal").forEach(inp => {
            inp.onchange = (e) => rows[parseInt(e.target.dataset.idx)].credit = parseFloat(e.target.value) || 0;
        });
        window.rowsData = rows;
    }

    window.addRow = function() {
        let rows = window.rowsData || [{ accountId: "", debit: 0, credit: 0 }];
        rows.push({ accountId: "", debit: 0, credit: 0 });
        window.rowsData = rows;
        showJournal();
    };
    window.removeRow = function(idx) {
        let rows = window.rowsData;
        if(rows.length > 1) rows.splice(idx,1);
        else { alert("لابد من وجود سطر واحد"); return; }
        window.rowsData = rows;
        showJournal();
    };
    window.cancelEdit = function() { editingId = null; showJournal(); };
    window.saveEntry = function() {
        let date = document.getElementById("entryDate").value;
        let desc = document.getElementById("entryDesc").value;
        let lines = window.rowsData || [];
        let totalDebit=0, totalCredit=0;
        lines = lines.filter(l => l.accountId && (l.debit>0 || l.credit>0));
        lines.forEach(l => { totalDebit+=l.debit; totalCredit+=l.credit; });
        if(lines.length === 0) { alert("أضف سطر واحد على الأقل"); return; }
        if(Math.abs(totalDebit - totalCredit) > 0.01) { alert("يجب أن يتساوى مجموع المدين والدائن"); return; }
        if(editingId) {
            let idx = journalEntries.findIndex(e => e.id === editingId);
            if(idx !== -1) journalEntries[idx] = { id: editingId, date, desc, lines };
            editingId = null;
        } else {
            journalEntries.push({ id: Date.now(), date, desc, lines });
        }
        saveData();
        window.rowsData = [{ accountId: "", debit: 0, credit: 0 }];
        showEntries();
    };

    function showEntries() {
        if(journalEntries.length === 0) {
            document.getElementById("mainContent").innerHTML = "<div class='card'>لا توجد قيود</div>";
            return;
        }
        let html = `<div class="card"><h3>قائمة القيود</h3><div class="table-responsive"><tr><thead><tr><th>التاريخ</th><th>البيان</th><th>عدد السطور</th><th>إجراءات</th></tr></thead><tbody>`;
        journalEntries.slice().reverse().forEach(e => {
            html += `<tr><td>${e.date}</td><td>${e.desc}</td><td>${e.lines.length}</td>
            <td><button onclick="editEntry(${e.id})" class="btn-warning">تعديل</button>
            ${(currentUser.role === 'admin') ? `<button onclick="deleteEntry(${e.id})" class="btn-danger">حذف</button>` : ''}</td></tr>`;
        });
        html += `</tbody></div></div>`;
        document.getElementById("mainContent").innerHTML = html;
    }
    window.editEntry = function(id) { editingId = id; showJournal(); };
    window.deleteEntry = function(id) { if(confirm("حذف القيد؟")) { journalEntries = journalEntries.filter(e => e.id !== id); saveData(); showEntries(); } };

    function showIncome() {
        let balances = getBalances();
        let inc=0, exp=0;
        accounts.forEach(a => { if(a.type==='income') inc += balances[a.id]?.amount || 0; if(a.type==='expense') exp += balances[a.id]?.amount || 0; });
        let net = inc - exp;
        document.getElementById("mainContent").innerHTML = `<div class="card"><h3>📊 قائمة الدخل</h3><div class="stats"><div class="stat-box">إيرادات<br>${inc.toFixed(2)}</div><div class="stat-box">مصروفات<br>${exp.toFixed(2)}</div><div class="stat-box">صافي الربح<br>${net.toFixed(2)}</div></div></div>`;
    }
    function showBalance() {
        let balances = getBalances();
        let assets=0, equity=0;
        accounts.forEach(a => { if(a.type==='asset') assets += balances[a.id]?.amount || 0; if(a.type==='equity') equity += balances[a.id]?.amount || 0; });
        document.getElementById("mainContent").innerHTML = `<div class="card"><h3>⚖️ المركز المالي</h3><div class="stats"><div class="stat-box">الأصول<br>${assets.toFixed(2)}</div><div class="stat-box">حقوق الملكية<br>${equity.toFixed(2)}</div></div></div>`;
    }
    function showTrial() {
        let balances = getBalances();
        let rows = "";
        let totalD=0, totalC=0;
        accounts.forEach(acc => {
            let bal = balances[acc.id];
            let debit = bal.type === "debit" ? bal.amount : 0;
            let credit = bal.type === "credit" ? bal.amount : 0;
            totalD += debit; totalC += credit;
            rows += `<tr><td>${acc.code}</td><td>${acc.name}</td><td>${debit.toFixed(2)}</td><td>${credit.toFixed(2)}</td></tr>`;
        });
        rows += `<tr style="background:#ffe0b3;font-weight:bold"><td colspan="2">المجموع</td><td>${totalD.toFixed(2)}</td><td>${totalC.toFixed(2)}</td></tr>`;
        document.getElementById("mainContent").innerHTML = `<div class="card"><h3>📋 ميزان المراجعة</h3><div class="table-responsive"><table><thead><tr><th>كود</th><th>الحساب</th><th>مدين</th><th>دائن</th></tr></thead><tbody>${rows}</tbody></div></div>`;
    }

    function showUsers() {
        if(currentUser.role !== 'admin') { document.getElementById("mainContent").innerHTML = "<div class='card'>❌ غير مسموح</div>"; return; }
        let html = `<div class="card"><h3>👥 إدارة المستخدمين</h3><button onclick="addUserForm()" class="btn-success">+ مستخدم</button><div class="table-responsive"><table><thead><tr><th>اسم المستخدم</th><th>الاسم</th><th>الدور</th><th>إجراءات</th></tr></thead><tbody>`;
        users.forEach(u => {
            html += `<tr><td>${u.username}</td><td>${u.name}</td><td>${u.role}</td>
            <td><button onclick="resetPass(${u.id})" class="btn-warning">تغيير باسورد</button> ${u.username !== 'admin' ? `<button onclick="delUser(${u.id})" class="btn-danger">حذف</button>` : ''}</td></tr>`;
        });
        html += `</tbody></div></div><div id="userForm" style="display:none;" class="card"><h4>إضافة مستخدم</h4><input id="newUser" placeholder="Username"><input id="newName" placeholder="الاسم"><input id="newPass" placeholder="كلمة المرور" type="password"><select id="newRole"><option>accountant</option><option>viewer</option></select><button onclick="addUser()" class="btn-success">حفظ</button> <button onclick="closeUserForm()" class="btn-danger">إلغاء</button></div>`;
        document.getElementById("mainContent").innerHTML = html;
    }
    window.addUserForm = () => document.getElementById("userForm").style.display = "block";
    window.closeUserForm = () => document.getElementById("userForm").style.display = "none";
    window.addUser = () => {
        let u = document.getElementById("newUser").value, n = document.getElementById("newName").value, p = document.getElementById("newPass").value, r = document.getElementById("newRole").value;
        if(u && n && p) { users.push({ id: Date.now(), username: u, password: p, name: n, role: r }); showUsers(); closeUserForm(); }
        else alert("املأ كل الحقول");
    };
    window.resetPass = (id) => { let newp = prompt("كلمة المرور الجديدة"); if(newp) { users.find(u => u.id === id).password = newp; showUsers(); } };
    window.delUser = (id) => { if(confirm("حذف؟")) { users = users.filter(u => u.id !== id); showUsers(); } };

    function showChangePass() {
        let html = `<div class="card"><h3>🔑 تغيير كلمة المرور</h3><input type="password" id="oldPass" placeholder="كلمة المرور الحالية"><input type="password" id="newPass1" placeholder="كلمة المرور الجديدة"><input type="password" id="newPass2" placeholder="تأكيد الجديدة"><button onclick="changePassword()" class="btn-success">تغيير</button></div>`;
        document.getElementById("mainContent").innerHTML = html;
    }
    window.changePassword = function() {
        let old = document.getElementById("oldPass").value;
        let new1 = document.getElementById("newPass1").value;
        let new2 = document.getElementById("newPass2").value;
        if(old !== currentUser.password) { alert("كلمة المرور الحالية خطأ"); return; }
        if(new1 !== new2) { alert("كلمة المرور غير متطابقة"); return; }
        currentUser.password = new1;
        let idx = users.findIndex(u => u.id === currentUser.id);
        if(idx !== -1) users[idx].password = new1;
        alert("تم التغيير بنجاح");
    };

    // ---------- تحكم الصفحات ----------
    function loadPage(page) {
        if(page === 'dashboard') showDashboard();
        else if(page === 'journal') showJournal();
        else if(page === 'entries') showEntries();
        else if(page === 'income') showIncome();
        else if(page === 'balance') showBalance();
        else if(page === 'trial') showTrial();
        else if(page === 'users') showUsers();
        else if(page === 'password') showChangePass();
    }
    document.querySelectorAll(".sidebar-item").forEach(item => {
        item.addEventListener("click", () => {
            document.querySelectorAll(".sidebar-item").forEach(i => i.classList.remove("active"));
            item.classList.add("active");
            loadPage(item.dataset.page);
        });
    });

    // ---------- تسجيل الدخول ----------
    window.doLogin = function() {
        let user = document.getElementById("loginUsername").value;
        let pass = document.getElementById("loginPassword").value;
        let found = users.find(u => u.username === user && u.password === pass);
        if(found) {
            currentUser = found;
            document.getElementById("loginScreen").style.display = "none";
            document.getElementById("app").style.display = "block";
            document.getElementById("userName").innerText = `مرحباً ${found.name}`;
            loadData();
            showDashboard();
        } else {
            document.getElementById("loginError").style.display = "block";
        }
    };
    window.logout = function() {
        saveData();
        currentUser = null;
        document.getElementById("loginScreen").style.display = "flex";
        document.getElementById("app").style.display = "none";
        document.getElementById("loginUsername").value = "";
        document.getElementById("loginPassword").value = "";
        document.getElementById("loginError").style.display = "none";
    };
</script>
</body>
</html>
